<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
  body { width:340px; margin:0; padding:12px; font-family:system-ui,sans-serif; background:#0b0e14; color:#e8ecf4; }
  button { width:100%; background:#3ddc84; color:#06130c; border:0; border-radius:8px; padding:10px; font-weight:700; cursor:pointer; }
  .r { border:1px solid #232b3d; border-radius:8px; padding:8px 10px; margin-top:8px; font-size:13px; }
  .v { font-size:11px; font-weight:800; text-transform:uppercase; border-radius:4px; padding:2px 6px; }
  .supported{background:#0f2e1f;color:#3ddc84}.contested{background:#33270a;color:#ffb020}
  .refuted{background:#331212;color:#ff5d5d}.unverifiable{background:#222839;color:#8b94a9}
  #status{color:#8b94a9;font-size:12px;margin-top:8px}
</style>
</head>
<body>
  <button id="verify">Verify this page</button>
  <div id="status"></div>
  <div id="results"></div>
  <script src="popup.js"></script>
</body>
</html>

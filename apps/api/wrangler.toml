name = "veriq-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
API_BASE_URL = "https://veriq-api.workers.dev"

# --- bindings (provisioned 2026-10-02) ---
[[d1_databases]]
binding = "DB"
database_name = "veriq-db"
database_id = "180710a2-bbc6-41cc-9203-7df4c3852cb0"

[[kv_namespaces]]
binding = "CACHE"
id = "2be846dc543641cb93e12c4772c3f172"

# R2 snapshots deferred until R2 is activated on the account
# (requires a payment method on file; free tier is $0 base).

name = "veriq-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
API_BASE_URL = "https://veriq-api.workers.dev"

# --- bindings (provisioned 2026-10-02) ---
[[d1_databases]]
binding = "DB"
database_name = "veriq-db"
database_id = "180710a2-bbc6-41cc-9203-7df4c3852cb0"

[[kv_namespaces]]
binding = "CACHE"
id = "2be846dc543641cb93e12c4772c3f172"

# Private media: after activating R2, create a PRIVATE bucket and uncomment.
# No r2.dev public URL or public custom domain should be enabled.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "veriq-media"
# See docs/EVIDENCE_CHAT.md for local/staging/production provisioning.

[ai]
binding = "AI"

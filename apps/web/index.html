<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veriq — Verify anything</title>
<style>
  :root { --bg:#0b0e14; --card:#151a26; --line:#232b3d; --txt:#e8ecf4; --dim:#8b94a9;
          --ok:#3ddc84; --warn:#ffb020; --bad:#ff5d5d; --na:#8b94a9; }
  * { box-sizing:border-box; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { background:var(--bg); color:var(--txt); margin:0; padding:2rem 1rem; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:1.6rem; letter-spacing:-.02em; }
  h1 .q { color:var(--ok); }
  p.sub { color:var(--dim); margin-top:-.6rem; }
  textarea { width:100%; min-height:140px; background:var(--card); color:var(--txt);
             border:1px solid var(--line); border-radius:12px; padding:1rem; font-size:1rem; resize:vertical; }
  button { background:var(--ok); color:#06130c; border:0; border-radius:10px;
           padding:.8rem 1.6rem; font-size:1rem; font-weight:700; cursor:pointer; margin-top:.8rem; }
  button:disabled { opacity:.5; cursor:wait; }
  .receipt { background:var(--card); border:1px solid var(--line); border-radius:12px;
             padding:1.1rem 1.2rem; margin-top:1rem; }
  .verdict { display:inline-block; font-size:.75rem; font-weight:800; text-transform:uppercase;
             letter-spacing:.06em; border-radius:6px; padding:.25rem .6rem; }
  .supported { background:#0f2e1f; color:var(--ok); } .contested { background:#33270a; color:var(--warn); }
  .refuted { background:#331212; color:var(--bad); } .unverifiable { background:#222839; color:var(--na); }
  .conf { color:var(--dim); font-size:.85rem; margin-left:.6rem; }
  blockquote { border-left:3px solid var(--line); margin:.8rem 0; padding:.2rem .8rem; color:#c6cddc; font-size:.92rem; }
  blockquote a { color:var(--dim); font-size:.8rem; display:block; margin-top:.3rem; text-decoration:none; }
  .mind { font-size:.85rem; color:var(--dim); font-style:italic; margin-top:.6rem; }
  #status { color:var(--dim); margin-top:1rem; }
</style>
</head>
<body>
<main>
  <h1>Veriq<span class="q">?</span></h1>
  <p class="sub">Paste anything. Get every claim verified against real sources.</p>
  <textarea id="input" placeholder="Paste text to verify…"></textarea>
  <button id="go">Verify</button>
  <div id="status"></div>
  <div id="results"></div>
</main>
<script src="app.js"></script>
</body>
</html>
